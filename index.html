<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Skill Quest</title>

<style>
.logos {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 25px;
    margin-bottom: 25px;
}

.logos img {
    width: 185px;
    height: 185px;
    object-fit: contain;
}

@media (max-width: 1500px) {
    .logos img {
        width: 70px;
        height: 70px;
    }

    .logos {
        gap: 18px;
    }
}
    .join-club {
    margin-top: 25px;
    padding: 22px 18px;
    background: #0c1320;
    border: 1px solid #334155;
    border-radius: 18px;
    text-align: center;
}

.join-icon {
    font-size: 40px;
    margin-bottom: 10px;
}

.join-club h2 {
    margin-bottom: 8px;
}

.join-club p {
    color: #aeb9ca;
    line-height: 1.5;
    margin-bottom: 5px;
}
/* =========================
   GLOBAL
========================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #070b13;
    color: #ffffff;
    min-height: 100vh;
}

button,
input {
    font: inherit;
}

button {
    cursor: pointer;
}


/* =========================
   APP
========================= */

.app {
    width: 100%;
    max-width: 760px;
    margin: auto;
    padding: 25px 18px 40px;
}


/* =========================
   HOME
========================= */

.hero {
    text-align: center;
    padding: 35px 10px;
}

.badge {
    display: inline-block;
    border: 1px solid #334155;
    background: #101827;
    padding: 8px 14px;
    border-radius: 30px;
    font-size: 12px;
    letter-spacing: 1px;
    color: #9fb9ff;
}

.hero h1 {
    font-size: clamp(45px, 12vw, 80px);
    margin-top: 20px;
    line-height: 0.95;
    letter-spacing: -4px;
}

.hero h1 span {
    color: #6ea8ff;
}

.hero p {
    color: #9ca8bb;
    margin-top: 15px;
    margin-bottom: 25px;
}

.name-input {
    width: min(350px, 100%);
    padding: 15px;
    border-radius: 12px;
    border: 1px solid #334155;
    background: #111827;
    color: white;
    outline: none;
}

.name-input:focus {
    border-color: #6ea8ff;
}


/* =========================
   GAME CARDS
========================= */

.games {
    display: grid;
    gap: 15px;
}

.game-card {
    width: 100%;
    text-align: left;
    padding: 22px;
    border-radius: 20px;
    border: 1px solid #263244;
    background: #111827;
    color: white;
    transition: 0.2s;
}

.game-card:hover {
    transform: translateY(-3px);
    border-color: #6ea8ff;
}

.game-icon {
    font-size: 35px;
    margin-bottom: 12px;
}

.game-card h2 {
    font-size: 20px;
    margin-bottom: 7px;
}

.game-card p {
    color: #9ca8bb;
    font-size: 14px;
    margin-bottom: 18px;
}

.play {
    color: #6ea8ff;
    font-weight: bold;
    font-size: 13px;
}


/* =========================
   GAME SCREEN
========================= */

.game-screen {
    display: none;
}

.game-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 25px;
}

.game-title {
    font-size: 20px;
}

.timer {
    background: #151e2e;
    border: 1px solid #334155;
    padding: 8px 12px;
    border-radius: 10px;
    font-weight: bold;
}


/* =========================
   QUESTION
========================= */

.question-box {
    background: #111827;
    border: 1px solid #263244;
    padding: 22px;
    border-radius: 18px;
    margin-bottom: 15px;
}

.question-box h2 {
    font-size: 22px;
    line-height: 1.3;
}

.question-box p {
    color: #aeb9ca;
    margin-top: 10px;
    line-height: 1.5;
}


/* =========================
   OPTIONS
========================= */

.options {
    display: grid;
    gap: 10px;
}

.option {
    width: 100%;
    text-align: left;
    padding: 15px;
    border-radius: 13px;
    background: #141d2c;
    border: 1px solid #334155;
    color: white;
    transition: 0.15s;
}

.option:hover {
    border-color: #6ea8ff;
}

.option.correct {
    border-color: #54d38a;
}

.option.wrong {
    border-color: #ff6b6b;
}


/* =========================
   BUTTONS
========================= */

.primary-btn {
    width: 100%;
    margin-top: 15px;
    padding: 15px;
    border: none;
    border-radius: 13px;
    background: #6ea8ff;
    color: #07101e;
    font-weight: bold;
}

.secondary-btn {
    margin-top: 15px;
    width: 100%;
    padding: 14px;
    border-radius: 13px;
    border: 1px solid #334155;
    background: transparent;
    color: white;
}


/* =========================
   RESULT
========================= */

.result {
    display: none;
    text-align: center;
    background: #111827;
    border: 1px solid #263244;
    border-radius: 20px;
    padding: 30px 20px;
}

.result-icon {
    font-size: 60px;
    margin-bottom: 15px;
}

.result h1 {
    margin-bottom: 10px;
}

.score {
    font-size: 55px;
    font-weight: bold;
    color: #6ea8ff;
    margin: 20px 0;
}

.result p {
    color: #aeb9ca;
    line-height: 1.5;
}


/* =========================
   STATS
========================= */

.stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 20px;
}

.stat {
    background: #151e2e;
    border: 1px solid #263244;
    padding: 15px;
    border-radius: 12px;
}

.stat small {
    color: #8d9ab0;
}

.stat strong {
    display: block;
    font-size: 20px;
    margin-top: 5px;
}


/* =========================
   ESCAPE ROOM
========================= */

.escape-room {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-top: 20px;
}

.room-item {
    padding: 25px 10px;
    border-radius: 15px;
    border: 1px solid #334155;
    background: #141d2c;
    text-align: center;
}

.room-item div {
    font-size: 35px;
    margin-bottom: 8px;
}

.room-item span {
    font-size: 13px;
    color: #aeb9ca;
}


/* =========================
   CLUE
========================= */

.clue {
    background: #0c1320;
    border: 1px dashed #52627a;
    padding: 18px;
    border-radius: 13px;
    margin: 15px 0;
    line-height: 1.6;
}

.code {
    font-family: monospace;
    font-size: 18px;
    letter-spacing: 2px;
}


/* =========================
   FOOTER
========================= */

footer {
    text-align: center;
    margin-top: 35px;
    color: #64748b;
    font-size: 12px;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 500px) {

    .app {
        padding: 15px 14px 30px;
    }

    .hero {
        padding-top: 25px;
    }

    .hero h1 {
        font-size: 55px;
    }

    .game-header {
        align-items: flex-start;
    }

    .question-box h2 {
        font-size: 19px;
    }
}

</style>
</head>


<body>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
 function joinClub() {
    window.open(
        "https://forms.gle/Jk9ua4QeCbiM9Kmp8",
        "_blank"
    );
}   
const SUPABASE_URL = "https://jgqrdtopziyqhalgxdxt.supabase.co";
const SUPABASE_KEY = "sb_publishable_YrwPIA2BAO7jUbE-STkkjg_XJ1cfrUa";
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

let playerName = "Player";
let playerId = null;
let attemptId = null;
let score = 0;
let currentGame = "";
let timerInterval = null;
let gameStartTime = null;
let currentQuestions = [];
let currentIndex = 0;
let escapeChallenges = [];
let escapeIndex = 0;

const home = document.getElementById("home");
const gameScreen = document.getElementById("gameScreen");
const result = document.getElementById("result");
const gameTitle = document.getElementById("gameTitle");
const gameContent = document.getElementById("gameContent");
const timer = document.getElementById("timer");

function shuffle(array) {
    const a = [...array];
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

function escapeHTML(value) {
    return String(value ?? "")
        .replace(/&/g, "&amp;").replace(/</g, "&lt;")
        .replace(/>/g, "&gt;").replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function getPlayerName() {
    playerName = document.getElementById("playerName").value.trim() || "Player";
    playerName = playerName.substring(0, 20);
}

async function createPlayer() {
    const { data, error } = await db.from("players")
        .insert({ name: playerName })
        .select("id").single();
    if (error) throw new Error("Could not register player.");
    playerId = data.id;
}

async function createAttempt(game, totalQuestions) {
    const { data, error } = await db.from("attempts")
        .insert({
            player_id: playerId,
            game,
            score: 0,
            total_questions: totalQuestions,
            time_taken: 0
        })
        .select("id").single();
    if (error) throw new Error("Could not start game.");
    attemptId = data.id;
}

async function loadRandomQuestions(game, amount) {
    const { data, error } = await db.from("questions")
        .select("id, game, question, option_a, option_b, option_c, option_d, correct_answer")
        .eq("game", game);

    if (error) throw new Error("Could not load questions.");
    if (!data || data.length < amount)
        throw new Error(`Not enough ${game} questions in the database.`);

    return shuffle(data).slice(0, amount).map(q => ({
        id: q.id,
        question: q.question,
        options: shuffle([q.option_a, q.option_b, q.option_c, q.option_d]
            .filter(v => v !== null && v !== undefined)),
        correct: q.correct_answer
    }));
}

async function saveAssignedQuestions() {
    if (!attemptId || !currentQuestions.length) return;
    const rows = currentQuestions.map((q, i) => ({
        attempt_id: attemptId,
        question_id: q.id,
        question_order: i + 1
    }));
    const { error } = await db.from("attempt_questions").insert(rows);
    if (error) console.error("Assignment save:", error);
}

async function saveAttempt(finalScore) {
    if (!attemptId) return;
    const elapsed = gameStartTime
        ? Math.floor((Date.now() - gameStartTime) / 1000) : 0;
    const { error } = await db.from("attempts").update({
        score: finalScore,
        time_taken: elapsed
    }).eq("id", attemptId);
    if (error) console.error("Score save:", error);
}

async function prepareGame(gameName) {
    getPlayerName();
    home.style.display = "none";
    result.style.display = "none";
    gameScreen.style.display = "block";

    currentGame = gameName;
    score = 0;
    currentIndex = 0;
    playerId = null;
    attemptId = null;
    currentQuestions = [];
    gameStartTime = Date.now();

    gameContent.innerHTML = `
        <div class="question-box">
            <h2>☁️ Preparing your challenge...</h2>
            <p>Connecting to Skill Quest.</p>
        </div>`;

    try {
        await createPlayer();
        const dbGame = gameName === "ceo" ? "CEO" : "MACHINE";
        currentQuestions = await loadRandomQuestions(dbGame, 7);
        await createAttempt(gameName, currentQuestions.length);
        await saveAssignedQuestions();
        return true;
    } catch (e) {
        console.error(e);
        gameScreen.style.display = "none";
        home.style.display = "block";
        alert(e.message || "Something went wrong. Please try again.");
        return false;
    }
}

function startTimer(seconds, callback) {
    clearInterval(timerInterval);
    let remaining = seconds;
    updateTimer(remaining);
    timerInterval = setInterval(() => {
        remaining--;
        updateTimer(remaining);
        if (remaining <= 0) {
            clearInterval(timerInterval);
            callback();
        }
    }, 1000);
}

function updateTimer(seconds) {
    timer.textContent =
        String(Math.floor(seconds / 60)).padStart(2, "0") + ":" +
        String(seconds % 60).padStart(2, "0");
}

async function showResult(title, message) {
    clearInterval(timerInterval);
    await saveAttempt(score);
    gameScreen.style.display = "none";
    result.style.display = "block";
    document.getElementById("resultTitle").textContent = title;
    document.getElementById("finalScore").textContent = score;
    document.getElementById("resultMessage").textContent = message;
    document.getElementById("resultPlayer").textContent = playerName;
    document.getElementById("resultScore").textContent = score;
    document.getElementById("leaderboard").style.display = "none";
    window.scrollTo(0, 0);
}

/* CEO */
async function startCEO() {
    if (!await prepareGame("ceo")) return;
    gameTitle.textContent = "🧑‍💼 24 HOURS: CEO";
    renderCEO();
    startTimer(180, () => showResult("⏰ TIME'S UP",
        "The company needed faster decisions."));
}

function renderCEO() {
    if (currentIndex >= currentQuestions.length) {
        showResult("🚀 COMPANY SURVIVED!",
            "You made it through the crisis. Your leadership score shows how well you handled pressure.");
        return;
    }
    const q = currentQuestions[currentIndex];
    gameContent.innerHTML = `
        <div class="badge">DECISION ${currentIndex + 1} / ${currentQuestions.length}</div>
        <div class="question-box">
            <h2>${escapeHTML(q.question)}</h2>
            <p>Choose the decision you think is best.</p>
        </div>
        <div class="options">
            ${q.options.map((o,i) => `
                <button class="option" onclick="answerCEO(${i})">${escapeHTML(o)}</button>
            `).join("")}
        </div>`;
}

function answerCEO(choice) {
    const q = currentQuestions[currentIndex];
    score += q.options[choice] === q.correct ? 300 : 100;
    currentIndex++;
    renderCEO();
}

/* HUMAN VS MACHINE */
async function startMachine() {
    if (!await prepareGame("machine")) return;
    gameTitle.textContent = "🤖 HUMAN VS MACHINE";
    renderMachine();
    startTimer(120, () => showResult("🤖 TIME'S UP",
        "The machine had the advantage this time."));
}

function renderMachine() {
    if (currentIndex >= currentQuestions.length) {
        const machineScore = 700;
        if (score >= machineScore) {
            showResult("🧠 YOU BEAT THE MACHINE!",
                `Your score was ${score}. The machine benchmark was ${machineScore}.`);
        } else {
            showResult("🤖 MACHINE WINS!",
                `Your score was ${score}. The machine benchmark was ${machineScore}. Try again!`);
        }
        return;
    }
    const q = currentQuestions[currentIndex];
    gameContent.innerHTML = `
        <div class="badge">CHALLENGE ${currentIndex + 1} / ${currentQuestions.length}</div>
        <div class="question-box"><h2>${escapeHTML(q.question)}</h2></div>
        <div class="options">
            ${q.options.map((o,i) => `
                <button class="option" onclick="answerMachine(${i})">${escapeHTML(o)}</button>
            `).join("")}
        </div>`;
}

function answerMachine(choice) {
    const q = currentQuestions[currentIndex];
    if (q.options[choice] === q.correct) score += 100;
    currentIndex++;
    renderMachine();
}

/* DIGITAL ESCAPE */
function generateEscapeChallenges() {
    const a = Math.floor(Math.random() * 20) + 10;
    const b = Math.floor(Math.random() * 20) + 20;
    const n = Math.floor(Math.random() * 8) + 4;
    const binary = n.toString(2);

    return [
        {
            title:"📧 EMAIL",
            clue:`You find an email containing:<br><br><b>${a} / ${a*2} / ${a*3} / ?</b>`,
            question:"What number comes next?", answer:String(a*4)
        },
        {
            title:"📁 FILE",
            clue:`A strange file contains:<br><br><span class="code">${binary}</span>`,
            question:"Convert the binary number to decimal.", answer:String(n)
        },
        {
            title:"🔐 SAFE",
            clue:`The system gives you <b>${n}</b>.<br><br>Add ${b}.`,
            question:"What is the key?", answer:String(n+b)
        },
        {
            title:"🚪 EXIT",
            clue:`The final panel shows:<br><br><b>${a} + ${b} + ${n}</b>`,
            question:"Enter the final number to escape.", answer:String(a+b+n)
        }
    ];
}

async function startEscape() {
    getPlayerName();
    home.style.display = "none";
    result.style.display = "none";
    gameScreen.style.display = "block";
    currentGame = "escape";
    score = 0;
    escapeIndex = 0;
    attemptId = null;
    playerId = null;
    gameStartTime = Date.now();
    gameTitle.textContent = "🚪 DIGITAL ESCAPE";
    escapeChallenges = generateEscapeChallenges();

    try {
        await createPlayer();
        await createAttempt("escape", escapeChallenges.length);
    } catch(e) {
        gameScreen.style.display = "none";
        home.style.display = "block";
        alert(e.message || "Could not start the escape game.");
        return;
    }

    renderEscape();
    startTimer(300, () => showResult("⏰ SYSTEM LOCKED",
        "You ran out of time before finding the final key."));
}

function renderEscape() {
    if (escapeIndex >= escapeChallenges.length) {
        showResult("🔓 YOU ESCAPED!",
            "You found every clue and solved the digital escape room.");
        return;
    }
    const c = escapeChallenges[escapeIndex];
    gameContent.innerHTML = `
        <div class="question-box">
            <h2>${c.title}</h2>
            <div class="clue">${c.clue}</div>
            <p>${c.question}</p>
        </div>
        <input id="escapeAnswer" class="name-input" style="width:100%"
            placeholder="Enter your answer" autocomplete="off">
        <button class="primary-btn" onclick="submitEscape()">UNLOCK →</button>`;
}

function submitEscape() {
    const input = document.getElementById("escapeAnswer");
    const answer = input.value.trim().toUpperCase();
    const correct = escapeChallenges[escapeIndex].answer.toUpperCase();
    if (answer === correct) {
        score += 500;
        escapeIndex++;
        renderEscape();
    } else {
        input.value = "";
        input.placeholder = "Incorrect — try again";
    }
}

/* LEADERBOARD */
async function loadLeaderboard() {
    const box = document.getElementById("leaderboard");
    const list = document.getElementById("leaderboardList");
    box.style.display = "block";
    list.innerHTML = "Loading...";

    const { data, error } = await db.from("attempts")
        .select("score, game, created_at, players(name)")
        .order("score", { ascending: false })
        .limit(20);

    if (error) {
        console.error(error);
        list.innerHTML = "Could not load leaderboard.";
        return;
    }

    if (!data?.length) {
        list.innerHTML = "No scores yet. Be the first!";
        return;
    }

    list.innerHTML = data.map((r,i) => `
        <div style="display:flex;justify-content:space-between;gap:12px;
                    padding:12px 0;border-bottom:1px solid #263244;">
            <span><strong>#${i+1}</strong> ${escapeHTML(r.players?.name || "Player")}
                <small style="color:#64748b">(${escapeHTML(r.game)})</small>
            </span>
            <strong>${r.score}</strong>
        </div>`).join("");
}

function goHome() {
    clearInterval(timerInterval);
    result.style.display = "none";
    gameScreen.style.display = "none";
    home.style.display = "block";
    document.getElementById("leaderboard").style.display = "none";
    window.scrollTo(0,0);
}

function playAgain() {
    if (currentGame === "ceo") startCEO();
    else if (currentGame === "machine") startMachine();
    else if (currentGame === "escape") startEscape();
}
</script>


</body>
